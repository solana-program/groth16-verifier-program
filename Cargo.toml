[workspace]
members = ["groth16-verify", "program", "tools/convert"]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
    'cfg(feature, values("custom-panic"))',
] }

[workspace.dependencies]
# On-chain
# `copy` makes `Address`/`AccountView` `Copy`, which the processors rely on to
# hold the program id past further `&mut context` use.
pinocchio = { version = "0.11.2", default-features = false, features = ["copy"] }
pinocchio-system = "0.6.1"
solana-groth16-verify = { path = "groth16-verify", version = "0.1.0", default-features = false }

# Host-side conversion and proof generation (tools/)
groth16-convert = { path = "tools/convert", version = "0.1.0" }
ark-bn254 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
ark-std = "0.5.0"
# ark-groth16 0.5 is the release built on the arkworks 0.5 line that
# `solana-bn254` uses; 0.6 pulls in a second, incompatible arkworks.
ark-groth16 = "0.5.0"
ark-relations = "0.5.0"
ark-r1cs-std = "0.5.0"
ark-snark = "0.5.0"
sha2 = "0.10.8"

# Test harness
# 0.3 pairs with the rand 0.8 that ark-std 0.5 re-exports.
rand_chacha = "0.3.1"
mollusk-svm = "0.13.1"
solana-account = "3.4.0"
solana-address = "2.7.0"
solana-instruction = "3.3.0"
solana-program-error = "3.0.1"
solana-sdk-ids = "3.1.0"
